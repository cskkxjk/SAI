name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则使用 tag 或 config_server.__version__）"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python: "3.14"
          - runner: macos-15-intel
            arch: x64
            python: "3.13"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 解析版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SOURCE="$(sed -n "s/^__version__ = '\([^']*\)'.*/\1/p" config_server.py | head -n 1)"
          VER="$INPUT_VERSION"
          if [ -z "$VER" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="$SOURCE"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VER" != "$SOURCE" ]; then
            echo "::error::tag $VER 与 config_server.py 的 $SOURCE 不一致；请先更新版本号再打 tag"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 注入 llama.cpp 运行库（${{ matrix.arch }}）
        run: |
          set -euo pipefail
          read -r ARCHIVE SHA256 < <(/usr/bin/python3 -c \
            "import json,sys; s=json.load(open('core/server/engines/llama/bin/runtime-version.json'))['platforms']['darwin-${{ matrix.arch }}']; print(s['archive'], s['sha256'])")
          echo "运行库：$ARCHIVE"
          curl -fL --retry 3 -o "$RUNNER_TEMP/runtime.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b10621/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/runtime.tar.gz" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/runtime"
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C "$RUNNER_TEMP/runtime" --strip-components=1
          bin_dir=core/server/engines/llama/bin
          mkdir -p "$bin_dir"
          copied=0
          for path in "$RUNNER_TEMP"/runtime/libggml* "$RUNNER_TEMP"/runtime/libllama.*; do
            if [ -e "$path" ]; then
              cp -R "$path" "$bin_dir/"
              copied=$((copied + 1))
            fi
          done
          if [ "$copied" -lt 6 ]; then
            echo "::error::运行库条目过少（$copied），请检查压缩包内容"
            exit 1
          fi
          echo "已注入 $copied 个 libggml* / libllama* 运行库条目"

      - name: 校验运行库可加载
        run: |
          /usr/bin/python3 - <<'PY'
          import ctypes
          import json
          import pathlib

          bin_dir = pathlib.Path("core/server/engines/llama/bin")
          section = json.loads((bin_dir / "runtime-version.json").read_text(
              encoding="utf-8"))["platforms"]["darwin-${{ matrix.arch }}"]
          for name in section["files"]:
              path = bin_dir / name
              if not path.exists():
                  raise SystemExit(f"缺少运行库：{path}")
              ctypes.CDLL(str(path), mode=ctypes.RTLD_GLOBAL)
          print(f"运行库加载正常：{len(section['files'])} 个")
          PY

      - name: 打包 SAI.app
        run: ./release_macos.sh "${{ steps.version.outputs.version }}"

      - name: 校验 strip 后关键动态库可加载
        run: |
          /usr/bin/python3 - <<'PY'
          import ctypes
          import pathlib

          app = pathlib.Path("dist/SAI.app/Contents")
          wanted = ("libllvmlite.dylib", "libonnxruntime", "libsherpa-onnx-c-api.dylib",
                    "libggml", "libllama")
          loaded = []
          for path in sorted(app.rglob("*")):
              if not path.is_file():
                  continue
              if not (path.name.endswith(".dylib") or path.name.endswith(".so")):
                  continue
              if any(w in path.name for w in wanted):
                  ctypes.CDLL(str(path.resolve()))
                  loaded.append(path.name)
          if len(loaded) < 4:
              raise SystemExit(f"待校验动态库过少：{loaded}")
          print(f"strip 后关键动态库加载正常：{len(loaded)} 个：{', '.join(loaded)}")
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: sai-desktop-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: 附加到 Release（若已存在）
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/* --clobber \
            || echo "Release $GITHUB_REF_NAME 尚不存在，安装包保留在 Artifact 中"
          exit 0
