name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则使用 tag 或 config_server.__version__）"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 解析版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SOURCE="$(sed -n "s/^__version__ = '\([^']*\)'.*/\1/p" config_server.py | head -n 1)"
          VER="$INPUT_VERSION"
          if [ -z "$VER" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="$SOURCE"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$VER" != "$SOURCE" ]; then
            echo "::error::tag $VER 与 config_server.py 的 $SOURCE 不一致；请先更新版本号再打 tag"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: 注入 llama.cpp 运行库（${{ matrix.arch }}）
        run: |
          set -euo pipefail
          read -r ARCHIVE SHA256 < <(/usr/bin/python3 -c \
            "import json,sys; s=json.load(open('core/server/engines/llama/bin/runtime-version.json'))['platforms']['darwin-${{ matrix.arch }}']; print(s['archive'], s['sha256'])")
          echo "运行库：$ARCHIVE"
          curl -fL --retry 3 -o "$RUNNER_TEMP/runtime.tar.gz" \
            "https://github.com/ggml-org/llama.cpp/releases/download/b10621/$ARCHIVE"
          echo "$SHA256  $RUNNER_TEMP/runtime.tar.gz" | shasum -a 256 -c -
          mkdir -p core/server/engines/llama/bin
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C core/server/engines/llama/bin --strip-components=1
          /usr/bin/python3 - <<'PY'
          import pathlib
          import shutil

          keep = ("libggml", "libllama.")
          bin_dir = pathlib.Path("core/server/engines/llama/bin")
          removed = 0
          for path in sorted(bin_dir.iterdir()):
              if path.name.startswith(keep):
                  continue
              if path.is_dir():
                  shutil.rmtree(path)
              else:
                  path.unlink()
              removed += 1
          print(f"保留 libggml* / libllama* 运行库，移除 {removed} 个无关文件")
          PY

      - name: 校验运行库可加载
        run: |
          /usr/bin/python3 - <<'PY'
          import ctypes
          import json
          import pathlib

          bin_dir = pathlib.Path("core/server/engines/llama/bin")
          section = json.loads((bin_dir / "runtime-version.json").read_text(
              encoding="utf-8"))["platforms"]["darwin-${{ matrix.arch }}"]
          for name in section["files"]:
              path = bin_dir / name
              if not path.exists():
                  raise SystemExit(f"缺少运行库：{path}")
              ctypes.CDLL(str(path), mode=ctypes.RTLD_GLOBAL)
          print(f"运行库加载正常：{len(section['files'])} 个")
          PY

      - name: 打包 SAI.app
        run: ./release_macos.sh "${{ steps.version.outputs.version }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SAI-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

      - name: 附加到 Release（若已存在）
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" release/* --clobber \
            || echo "Release $GITHUB_REF_NAME 尚不存在，安装包保留在 Artifact 中"
          exit 0
