[project]
name = "sai"
version = "1.0.6"
description = "SAI 离线语音输入工具"
requires-python = ">=3.13,<3.15"

dependencies = [
    # ASR 核心
    "sherpa-onnx",
    # Windows/macOS 的 sherpa 轮子拆分依赖 core（linux 轮子自带，uv 解析时按 linux 轮子元数据会漏掉）
    "sherpa-onnx-core==1.13.8; sys_platform == 'win32' or sys_platform == 'darwin'",
    "numpy",
    "gguf",
    "onnxruntime-directml; sys_platform == 'win32'",
    # macOS 统一固定 1.23.2（官方最后一个同时提供 Intel / Apple Silicon 轮子的版本，要求 macOS 13.0）：
    # Intel 更高版本没有 x86_64 轮子；Apple Silicon 用最新版（1.30）会要求 macOS 14
    "onnxruntime==1.23.2; sys_platform == 'darwin'",
    "onnxruntime; sys_platform != 'win32' and sys_platform != 'darwin'",
    "sentencepiece",
    "soundfile",
    # Intel Mac 的 numba/llvmlite 轮子止步 0.62/0.45（Py3.13）
    "numba==0.62.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba; sys_platform != 'darwin' or platform_machine != 'x86_64'",

    # 网络与 API
    "websockets",
    "openai",
    "ollama",
    "httpx",
    "requests",

    # CLI 与界面
    "rich",
    "typer",
    "colorama",
    "markdown",
    "markdown-it-py",
    "tkhtmlview",

    # 输入与硬件
    "keyboard; sys_platform != 'darwin'",
    "pynput",
    "pyclip",
    "sounddevice",
    "watchdog",
    "pystray",
    "Pillow",

    # 数据处理
    "pypinyin",
    "srt",
    "rapidfuzz",
    "pydub",

    # Windows
    "pywin32; sys_platform == 'win32'",
    "psutil",
]

[dependency-groups]
build = [
    "pyinstaller",
    "modelscope",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
